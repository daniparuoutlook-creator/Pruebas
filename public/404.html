<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada · Daniel Padilla</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2316191F'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='34' font-weight='bold' fill='%23FFE24A' text-anchor='middle'%3EdP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--papel:#EDEFF2;--tinta:#16191F;--azul:#1F3BD6;--azul-hondo:#152BA0;--marcador:#FFE24A;--gris:#5B6470;--ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
html{caret-color:var(--azul)}
::selection{background:var(--marcador);color:var(--tinta)}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--papel);color:var(--tinta);
     font:400 17px/1.6 Archivo,system-ui,sans-serif;padding:24px}
main{max-width:560px}
h1{font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:700;font-size:clamp(32px,6vw,48px);
   line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.marca{background:var(--marcador);padding:0 6px;border-radius:2px}
p{color:var(--gris);margin:18px 0 0;text-wrap:pretty}
.acciones{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap}
a.boton{display:inline-flex;align-items:center;min-height:48px;padding:12px 22px;border-radius:6px;background:var(--azul);
        color:#fff;text-decoration:none;font-weight:600;transition:background .15s,transform .16s var(--ease-out)}
a.boton:hover{background:var(--azul-hondo)}
a.boton:active{transform:scale(.97)}
a.boton.claro{background:transparent;color:var(--tinta);border:1px solid var(--tinta)}
a.boton.claro:hover{background:var(--tinta);color:#fff}
:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
@media (prefers-reduced-motion:reduce){a.boton:active{transform:none}}
</style>
</head>
<body>
<main>
  <h1>Esta página <span class="marca">no existe</span>, o ya no está aquí</h1>
  <p>Puede que el enlace estuviera mal escrito o que la página se haya movido. Es justo el tipo de fallo que reviso en las webs de mis clientes.</p>
  <div class="acciones">
    <a class="boton" href="/">Volver al inicio</a>
    <a class="boton claro" href="/#contacto">Contactar</a>
  </div>
</main>
</body>
</html>
